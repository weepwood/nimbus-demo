version: 2
updates:
  # Nimbus/Astro peers are intentionally pinned. Their upgrades need a
  # compatibility review rather than automatic package updates.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      action-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
