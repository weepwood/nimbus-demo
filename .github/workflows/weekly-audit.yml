name: Weekly documentation health
on:
  schedule:
    - cron: "30 2 * * 0" # Sunday 02:30 UTC / 11:30 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Scheduled site audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 10.34.9
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Astro, Nimbus content and generated site
        run: pnpm run check
      - name: Write summary
        if: always()
        run: |
          {
            echo "## Nimbus Studio weekly audit"
            echo ""
            echo "- Commit: $(git rev-parse --short HEAD)"
            echo "- Workflow: Weekly documentation health"
            echo "- This checks generated artifacts, not live browser rendering or external sites."
          } >> "$GITHUB_STEP_SUMMARY"
