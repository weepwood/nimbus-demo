name: Bootstrap pnpm lockfile
on:
  push:
    paths:
      - scripts/lockfile-bootstrap.trigger
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v5
        with:
          version: 10.34.9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Generate reproducible dependency lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile is already up to date."
            exit 0
          fi
          git commit -m "chore: 锁定 pnpm 依赖解析结果"
          git push origin HEAD:main
